version: "3.8"

services:
  clinixconnect-app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongo_uri
      - JWT_SECRET=clinixconnect_jwt_secure_secret_key_8f3a9e2b1c4d7e0f
      - CORS_ORIGIN=*
      - SMTP_SERVER=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_EMAIL=yr_mail
      - SMTP_APP_PASSWORD=yrsmtp_pass
      - GOOGLE_CLIENT_ID=yr_client_id
      - GOOGLE_CLIENT_SECRET=yr_client_secret
      - GOOGLE_REFRESH_TOKEN=yr_refresh_token
    restart: always
